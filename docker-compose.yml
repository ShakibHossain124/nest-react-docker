services:
  postgres:
    image: postgres:17

    container_name: nest-postgres

    restart: always

    environment:
      POSTGRES_USER: shakib
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: nest_prisma_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
  nest-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nest-api
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - app_modules:/app/node_modules

    env_file:
      - ./backend/.env
    depends_on:
      - postgres
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: react-web

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules

    environment:
      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      - nest-api

volumes:
  postgres_data:
    name: nest-docker_postgres_data
  app_modules:
  frontend_modules:
  